<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TweeLive - Inloggning</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Auth Container -->
  <div id="authContainer" class="auth-container">
    <h1>🎉 TweeLive</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Logga in</button>
      <button class="tab-btn" onclick="switchTab('signup')">Registrera</button>
    </div>

    <!-- Login Tab -->
    <div id="login" class="tab-content active">
      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Användarnamn eller E-post:</label>
          <input type="text" id="identifier" name="identifier" placeholder="Ange användarnamn eller e-post" required>
        </div>

        <div class="form-group">
          <label for="password">Lösenord:</label>
          <input type="password" id="password" name="password" placeholder="Ange lösenord" required>
        </div>

        <button type="submit" class="btn-signin">Logga in</button>
      </form>

      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Signup Tab -->
    <div id="signup" class="tab-content">
      <form id="signupForm">
        <div class="form-group">
          <label for="firstName">Förnamn:</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Efternamn:</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
          <label for="regUsername">Användarnamn:</label>
          <input type="text" id="regUsername" name="username" required>
          <div id="usernameMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="email">E-postadress:</label>
          <input type="email" id="email" name="email" required>
          <div id="emailMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="regPassword">Lösenord:</label>
          <input type="password" id="regPassword" name="password" required>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Bekräfta lösenord:</label>
          <input type="password" id="passwordConfirm" name="passwordConfirm" required>
          <div id="passwordMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="gender">Kön:</label>
          <select id="gender" name="gender" required>
            <option value="">-- Välj --</option>
            <option value="0">Man</option>
            <option value="1">Kvinna</option>
          </select>
        </div>

        <div class="form-group">
          <label for="birthDate">Födelsedatum:</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <button type="submit" class="btn-signup">Registrera</button>
      </form>

      <div id="signupMessage" class="message"></div>
    </div>
  </div>

  <!-- Chat Container -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-header">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
        <div>Inloggad som: <span id="usernameDisplay"></span></div>
        <input
          type="text"
          id="statusMessageInput"
          placeholder="Mitt statusmeddelande..."
          maxlength="120"
          style="padding: 3px 6px; border: 1px solid #999; background: #fff; font-size: 11px; font-family: Tahoma, Arial; width: 250px;"
        >
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <button type="button" id="ljudKnapp" aria-label="Aktivera ljud" title="Aktivera ljud" style="padding: 4px 8px; font-size: 11px;">🔊 Aktivera ljud</button>
        <button class="logout-btn" onclick="performLogout()">Logga ut</button>
      </div>
    </div>

    <div style="display: flex; height: calc(100% - 60px);">
      <!-- Left Sidebar -->
      <div style="width: 280px; background: #e8e8e8; border-right: 1px solid #7f7f7f; overflow-y: auto; flex-direction: column; display: flex;">

        <!-- Search Section -->
        <div style="padding: 10px; border-bottom: 1px solid #7f7f7f;">
          <div style="font-weight: bold; color: #000; font-size: 11px; margin-bottom: 5px;">Sök användare</div>
          <div style="display: flex; gap: 3px; margin-bottom: 8px;">
            <input
              type="text"
              id="userSearchInput"
              placeholder="Användarnamn..."
              style="flex: 1; padding: 4px; font-size: 11px; border: 1px solid #999; background: #fff;"
              onkeypress="handleSearchKeypress(event)"
            >
            <button
              id="userSearchBtn"
              onclick="performSearch()"
              style="padding: 4px 8px; font-size: 11px;"
            >Sök</button>
          </div>

          <!-- Search Results -->
          <div id="searchResults" style="display: none; max-height: 300px; overflow-y: auto;">
            <div id="searchResultsList"></div>
          </div>
        </div>

        <!-- Kontakter -->
        <div style="padding: 10px; border-bottom: 1px solid #7f7f7f;">
          <div style="font-weight: bold; color: #000; font-size: 11px; margin-bottom: 5px;">Kontakter</div>
          <div id="friendsList" style="font-size: 11px;">
            <p style="color: #666; margin: 0; font-size: 11px;">Inga kontakter än</p>
          </div>
        </div>

        <!-- Pending Requests Section -->
        <div style="padding: 10px; flex: 1; overflow-y: auto;">
          <div style="font-weight: bold; color: #000; font-size: 11px; margin-bottom: 5px;">Väntande förfrågningar</div>
          <div id="pendingRequestsList" style="font-size: 11px;">
            <p style="color: #666; margin: 0; font-size: 11px;">Inga väntande förfrågningar</p>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div style="flex: 1; display: flex; flex-direction: column; background: #ece9d8;">
        <div id="noChatSelected" style="flex: 1; display: flex; align-items: center; justify-content: center;">
          <p style="color: #999; font-size: 12px;">Välj en kontakt för att chatta</p>
        </div>

        <div id="chatArea" style="display: none; flex-direction: column; height: 100%;">
          <div id="activeChatHeader" style="background: #c0c0c0; padding: 4px 8px; border-bottom: 1px solid #7f7f7f; font-size: 11px; border-top: 1px solid #dfce56; border-left: 1px solid #dfce56; border-right: 2px solid #808080;"></div>

          <div id="chatMessagesContainer" style="flex: 1; padding: 10px; overflow-y: auto; background: #fff; border: 1px solid #7f9db9; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1); margin: 8px; font-size: 11px;"></div>

          <div id="typingIndicator" style="display: none; padding: 4px 8px; font-size: 11px; color: #666; font-style: italic;"></div>

          <form id="chatMessageForm" style="display: flex; gap: 4px; padding: 8px; background: #ece9d8; border-top: 1px solid #dfce56;">
            <div id="emojiPopup" class="emoji-popup" role="group" aria-label="Välj en smiley" hidden></div>
            <input
              type="text"
              id="chatMessageInput"
              placeholder="Meddelande..."
              style="flex: 1; padding: 4px 6px; border: 1px solid #999; background: #fff; font-size: 11px; font-family: Tahoma, Arial;"
            >
            <input
              type="file"
              id="chatFileInput"
              accept="image/*,audio/*"
              style="display: none;"
            >
            <button
              type="submit"
              style="padding: 4px 12px; font-size: 11px;"
            >Skicka</button>
            <button
              type="button"
              id="attachFileBtn"
              style="padding: 4px 12px; font-size: 11px;"
            >Bifoga...</button>
            <button
              type="button"
              id="nudgeBtn"
              style="padding: 4px 12px; font-size: 11px;"
            >Titresha</button>
            <button
              type="button"
              id="emojiBtn"
              aria-controls="emojiPopup"
              aria-expanded="false"
              style="padding: 4px 8px; font-size: 11px;"
            >Smiley</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/js/audio.js" defer></script>
  <script src="/js/emojis.js" defer></script>
  <script src="/js/chat.js" defer></script>
  <script src="/js/main.js" defer></script>
</body>
</html>
