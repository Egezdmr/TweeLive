<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TweeLive - Inloggning</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .chat-container {
      display: none;
      width: 100%;
      height: 100vh;
      background: #f5f5f5;
      flex-direction: column;
    }
    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      position: relative;
    }
    .logout-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: white;
      color: #667eea;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .logout-btn:hover {
      background: #f0f0f0;
    }
    .chat-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #e0e0e0;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .tab-btn.active {
      background: #667eea;
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    .validation-msg {
      font-size: 12px;
      margin-top: 3px;
      display: none;
    }
    .validation-msg.error {
      color: #d32f2f;
      display: block;
    }
    .validation-msg.success {
      color: #388e3c;
      display: block;
    }
    .validation-msg a {
      color: #d32f2f;
      text-decoration: underline;
      cursor: pointer;
    }
    .validation-msg small {
      display: block;
      margin-top: 3px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-signin, .btn-signup {
      width: 100%;
      background-color: #667eea;
      color: white;
      margin-top: 20px;
    }
    .btn-signin:hover, .btn-signup:hover {
      background-color: #5568d3;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .message.loading {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
  </style>
</head>
<body>
  <!-- Auth Container -->
  <div id="authContainer" class="auth-container">
    <h1>🎉 TweeLive</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Logga in</button>
      <button class="tab-btn" onclick="switchTab('signup')">Registrera</button>
    </div>

    <!-- Login Tab -->
    <div id="login" class="tab-content active">
      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Användarnamn eller E-post:</label>
          <input type="text" id="identifier" name="identifier" placeholder="Ange användarnamn eller e-post" required>
        </div>

        <div class="form-group">
          <label for="password">Lösenord:</label>
          <input type="password" id="password" name="password" placeholder="Ange lösenord" required>
        </div>

        <button type="submit" class="btn-signin">Logga in</button>
      </form>

      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Signup Tab -->
    <div id="signup" class="tab-content">
      <form id="signupForm">
        <div class="form-group">
          <label for="firstName">Förnamn:</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Efternamn:</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
          <label for="regUsername">Användarnamn:</label>
          <input type="text" id="regUsername" name="username" required>
          <div id="usernameMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="email">E-postadress:</label>
          <input type="email" id="email" name="email" required>
          <div id="emailMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="regPassword">Lösenord:</label>
          <input type="password" id="regPassword" name="password" required>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Bekräfta lösenord:</label>
          <input type="password" id="passwordConfirm" name="passwordConfirm" required>
          <div id="passwordMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="gender">Kön:</label>
          <select id="gender" name="gender" required>
            <option value="">-- Välj --</option>
            <option value="0">Erkek (Man)</option>
            <option value="1">Kadin (Kvinna)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="birthDate">Födelsedatum:</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <button type="submit" class="btn-signup">Registrera</button>
      </form>

      <div id="signupMessage" class="message"></div>
    </div>
  </div>

  <!-- Chat Container -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-header">
      Inloggad som: <span id="usernameDisplay"></span>
      <button class="logout-btn" onclick="logout()">Logga ut</button>
    </div>
    <div class="chat-content">
      <p>Chattskärm under utveckling...</p>
    </div>
  </div>

  <script>
    // ===== SESSION MANAGEMENT =====
    function saveUserToStorage(user) {
      localStorage.setItem('user', JSON.stringify(user));
    }

    function getUserFromStorage() {
      const user = localStorage.getItem('user');
      return user ? JSON.parse(user) : null;
    }

    function logout() {
      localStorage.removeItem('user');
      showAuthContainer();
    }

    function showAuthContainer() {
      document.getElementById('authContainer').style.display = 'block';
      document.getElementById('chatContainer').style.display = 'none';
    }

    function showChatContainer(username) {
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('chatContainer').style.display = 'flex';
      document.getElementById('usernameDisplay').textContent = username;
    }

    // Check if user is already logged in on page load
    window.addEventListener('load', () => {
      const user = getUserFromStorage();
      if (user) {
        showChatContainer(user.username);
      } else {
        showAuthContainer();
      }
    });

    // ===== TAB SWITCHING =====
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    // ===== LOGIN FORM =====
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;

      loginMessage.textContent = 'Loggar in...';
      loginMessage.className = 'message loading';
      loginMessage.style.display = 'block';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (data.success) {
          loginMessage.textContent = '✅ ' + data.message;
          loginMessage.className = 'message success';
          saveUserToStorage(data.user);
          setTimeout(() => {
            showChatContainer(data.user.username);
            loginForm.reset();
          }, 1500);
        } else {
          loginMessage.textContent = '❌ ' + data.message;
          loginMessage.className = 'message error';
        }
      } catch (error) {
        loginMessage.textContent = '❌ Ett fel uppstod';
        loginMessage.className = 'message error';
      }
    });

    // ===== SIGNUP FORM =====
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');
    const usernameInput = document.getElementById('regUsername');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('regPassword');
    const passwordConfirmInput = document.getElementById('passwordConfirm');

    usernameInput.addEventListener('input', checkUsernameRealtime);
    emailInput.addEventListener('input', validateEmailRealtime);
    passwordConfirmInput.addEventListener('input', validatePasswordsRealtime);

    async function checkUsernameRealtime() {
      const username = usernameInput.value.trim();
      const msg = document.getElementById('usernameMsg');
      if (!username) { msg.style.display = 'none'; return; }

      try {
        const response = await fetch(`/api/check-username/${username}`);
        const data = await response.json();
        if (data.exists) {
          msg.textContent = '❌ Användarnamnet är redan taget';
          msg.className = 'validation-msg error';
        } else {
          msg.textContent = '✅ Användarnamnet är tillgängligt';
          msg.className = 'validation-msg success';
        }
      } catch (error) {
        msg.textContent = '❌ Kunde inte verifiera användarnamn';
        msg.className = 'validation-msg error';
      }
    }

    async function validateEmailRealtime() {
      const email = emailInput.value.trim();
      const msg = document.getElementById('emailMsg');
      if (!email) { msg.style.display = 'none'; return; }

      if (!isValidEmail(email)) {
        msg.textContent = '❌ Ogiltig e-postformat';
        msg.className = 'validation-msg error';
        return;
      }

      try {
        const response = await fetch(`/api/check-email/${encodeURIComponent(email)}`);
        const data = await response.json();
        if (data.exists) {
          msg.innerHTML = '❌ E-postadressen är redan registrerad<br><small>Försök <a href="#" onclick="switchTab(\'login\'); return false;">logga in</a> istället</small>';
          msg.className = 'validation-msg error';
        } else {
          msg.textContent = '✅ E-postadressen är tillgänglig';
          msg.className = 'validation-msg success';
        }
      } catch (error) {
        msg.textContent = '❌ Kunde inte verifiera e-post';
        msg.className = 'validation-msg error';
      }
    }

    function validatePasswordsRealtime() {
      const password = passwordInput.value;
      const confirm = passwordConfirmInput.value;
      const msg = document.getElementById('passwordMsg');

      if (!confirm) { msg.style.display = 'none'; return; }

      if (password === confirm && password.length > 0) {
        msg.textContent = '✅ Lösenorden matchar';
        msg.className = 'validation-msg success';
      } else if (password.length > 0) {
        msg.textContent = '❌ Lösenorden matchar inte';
        msg.className = 'validation-msg error';
      } else {
        msg.style.display = 'none';
      }
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const username = usernameInput.value;
      const email = emailInput.value;
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;
      const gender = document.getElementById('gender').value;
      const birthDate = document.getElementById('birthDate').value;

      if (password !== passwordConfirm) {
        signupMessage.textContent = '❌ Lösenorden matchar inte';
        signupMessage.className = 'message error';
        signupMessage.style.display = 'block';
        return;
      }

      if (!isValidEmail(email)) {
        signupMessage.textContent = '❌ Ogiltig e-postformat';
        signupMessage.className = 'message error';
        signupMessage.style.display = 'block';
        return;
      }

      signupMessage.textContent = 'Registrerar...';
      signupMessage.className = 'message loading';
      signupMessage.style.display = 'block';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName, lastName, username, email, password,
            gender: parseInt(gender), birthDate
          })
        });

        const data = await response.json();

        if (data.success) {
          signupMessage.textContent = '✅ ' + data.message;
          signupMessage.className = 'message success';
          setTimeout(() => {
            signupForm.reset();
            switchTab('login');
          }, 2000);
        } else {
          signupMessage.textContent = '❌ ' + data.message;
          signupMessage.className = 'message error';
        }
      } catch (error) {
        signupMessage.textContent = '❌ Ett fel uppstod';
        signupMessage.className = 'message error';
      }
    });
  </script>
</body>
</html>
