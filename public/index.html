<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TweeLive - Inloggning</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-signin {
      background-color: #667eea;
      color: white;
    }
    .btn-signin:hover {
      background-color: #5568d3;
    }
    .btn-signup {
      background-color: #e0e0e0;
      color: #333;
    }
    .btn-signup:hover {
      background-color: #d0d0d0;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .message.loading {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 TweeLive</h1>

    <form id="loginForm">
      <div class="form-group">
        <label for="identifier">Användarnamn eller E-post:</label>
        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder="Ange användarnamn eller e-post"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Lösenord:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ange lösenord"
          required
        >
      </div>

      <div class="button-group">
        <button type="submit" class="btn-signin">Logga in</button>
        <button type="button" class="btn-signup" disabled>Registrera</button>
      </div>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;

      // Show loading message
      messageEl.textContent = 'Loggar in...';
      messageEl.className = 'message loading';
      messageEl.style.display = 'block';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (data.success) {
          messageEl.textContent = '✅ ' + data.message;
          messageEl.className = 'message success';
          messageEl.style.display = 'block';

          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 2000);
        } else {
          messageEl.textContent = '❌ ' + data.message;
          messageEl.className = 'message error';
          messageEl.style.display = 'block';

          // Clear form and redirect after 3 seconds
          setTimeout(() => {
            form.reset();
            messageEl.style.display = 'none';
          }, 3000);
        }
      } catch (error) {
        messageEl.textContent = '❌ Ett fel uppstod: ' + error.message;
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
