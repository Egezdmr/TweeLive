<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TweeLive - Inloggning</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #5a7edc;
    }
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .chat-container {
      display: none;
      width: 950px;
      height: 680px;
      background: #ece9d8;
      flex-direction: column;
      border: 2px solid #0055ea;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .chat-header {
      background: linear-gradient(to bottom, #0058ee 0%, #3593ff 50%, #288eff 100%);
      color: white;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      position: relative;
      border-bottom: 1px solid #004bb4;
    }
    .logout-btn {
      background: #ece9d8;
      color: #000;
      border: 1px solid #dfce56;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      padding: 4px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      font-family: Tahoma, Arial;
    }
    .logout-btn:active {
      border: 1px solid #808080;
      border-right: 1px solid #dfce56;
      border-bottom: 1px solid #dfce56;
    }
    .logout-btn:hover {
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #e0e0e0;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .tab-btn.active {
      background: #667eea;
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    .validation-msg {
      font-size: 12px;
      margin-top: 3px;
      display: none;
    }
    .validation-msg.error {
      color: #d32f2f;
      display: block;
    }
    .validation-msg.success {
      color: #388e3c;
      display: block;
    }
    .validation-msg a {
      color: #d32f2f;
      text-decoration: underline;
      cursor: pointer;
    }
    .validation-msg small {
      display: block;
      margin-top: 3px;
    }
    button {
      padding: 6px 12px;
      border: 1px solid #dfce56;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      border-radius: 2px;
      font-size: 12px;
      font-weight: bold;
      font-family: Tahoma, Arial;
      cursor: pointer;
      background: #ece9d8;
      color: #000;
      transition: background-color 0.1s;
    }
    button:active {
      border: 1px solid #808080;
      border-right: 1px solid #dfce56;
      border-bottom: 1px solid #dfce56;
    }
    button:hover {
      background: #e8e4cc;
    }
    .btn-signin, .btn-signup {
      width: 100%;
      background-color: #667eea;
      color: white;
      border: 1px solid #5568d3;
      border-right: 2px solid #354a7f;
      border-bottom: 2px solid #354a7f;
      margin-top: 20px;
    }
    .btn-signin:hover, .btn-signup:hover {
      background-color: #5568d3;
    }
    .btn-signin:active, .btn-signup:active {
      border: 1px solid #354a7f;
      border-right: 1px solid #5568d3;
      border-bottom: 1px solid #5568d3;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .message.loading {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .nudge-shake {
      animation: shake 0.5s;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 4px;
    }
    .status-online {
      background-color: #4CAF50;
    }
    .status-offline {
      background-color: #9E9E9E;
    }
    #chatMessagesContainer {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      border: 1px solid #7f9db9;
      background: #ffffff;
      padding: 10px;
    }
    .msn-message-wrapper {
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .msn-sender-line {
      font-weight: bold;
      color: #222;
      font-size: 12px;
      margin-bottom: 2px;
    }
    .msn-message-text {
      color: #222;
      font-size: 12px;
      padding-left: 12px;
      word-wrap: break-word;
    }
    .msn-nudge {
      text-align: center;
      color: #666;
      font-style: italic;
      margin: 6px 0;
    }
    .friend-item {
      transition: background-color 0.2s;
    }
    .friend-item:hover {
      background-color: #e3f2fd !important;
    }
  </style>
</head>
<body>
  <!-- Auth Container -->
  <div id="authContainer" class="auth-container">
    <h1>🎉 TweeLive</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Logga in</button>
      <button class="tab-btn" onclick="switchTab('signup')">Registrera</button>
    </div>

    <!-- Login Tab -->
    <div id="login" class="tab-content active">
      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Användarnamn eller E-post:</label>
          <input type="text" id="identifier" name="identifier" placeholder="Ange användarnamn eller e-post" required>
        </div>

        <div class="form-group">
          <label for="password">Lösenord:</label>
          <input type="password" id="password" name="password" placeholder="Ange lösenord" required>
        </div>

        <button type="submit" class="btn-signin">Logga in</button>
      </form>

      <div id="loginMessage" class="message"></div>
    </div>

    <!-- Signup Tab -->
    <div id="signup" class="tab-content">
      <form id="signupForm">
        <div class="form-group">
          <label for="firstName">Förnamn:</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Efternamn:</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
          <label for="regUsername">Användarnamn:</label>
          <input type="text" id="regUsername" name="username" required>
          <div id="usernameMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="email">E-postadress:</label>
          <input type="email" id="email" name="email" required>
          <div id="emailMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="regPassword">Lösenord:</label>
          <input type="password" id="regPassword" name="password" required>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Bekräfta lösenord:</label>
          <input type="password" id="passwordConfirm" name="passwordConfirm" required>
          <div id="passwordMsg" class="validation-msg"></div>
        </div>

        <div class="form-group">
          <label for="gender">Kön:</label>
          <select id="gender" name="gender" required>
            <option value="">-- Välj --</option>
            <option value="0">Man</option>
            <option value="1">Kvinna</option>
          </select>
        </div>

        <div class="form-group">
          <label for="birthDate">Födelsedatum:</label>
          <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <button type="submit" class="btn-signup">Registrera</button>
      </form>

      <div id="signupMessage" class="message"></div>
    </div>
  </div>

  <!-- Chat Container -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-header">
      Inloggad som: <span id="usernameDisplay"></span>
      <button class="logout-btn" onclick="performLogout()">Logga ut</button>
    </div>

    <div style="display: flex; height: calc(100% - 60px);">
      <!-- Left Sidebar -->
      <div style="width: 280px; background: #e8e8e8; border-right: 1px solid #7f7f7f; overflow-y: auto; flex-direction: column; display: flex;">

        <!-- Search Section -->
        <div style="padding: 10px; border-bottom: 1px solid #7f7f7f;">
          <div style="font-weight: bold; color: #000; font-size: 11px; margin-bottom: 5px;">Sök användare</div>
          <div style="display: flex; gap: 3px; margin-bottom: 8px;">
            <input
              type="text"
              id="userSearchInput"
              placeholder="Användarnamn..."
              style="flex: 1; padding: 4px; font-size: 11px; border: 1px solid #999; background: #fff;"
              onkeypress="handleSearchKeypress(event)"
            >
            <button
              id="userSearchBtn"
              onclick="performSearch()"
              style="padding: 4px 8px; font-size: 11px;"
            >Sök</button>
          </div>

          <!-- Search Results -->
          <div id="searchResults" style="display: none; max-height: 300px; overflow-y: auto;">
            <div id="searchResultsList"></div>
          </div>
        </div>

        <!-- Kontakter -->
        <div style="padding: 10px; border-bottom: 1px solid #7f7f7f;">
          <div style="font-weight: bold; color: #000; font-size: 11px; margin-bottom: 5px;">Kontakter</div>
          <div id="friendsList" style="font-size: 11px;">
            <p style="color: #666; margin: 0; font-size: 11px;">Inga kontakter än</p>
          </div>
        </div>

        <!-- Pending Requests Section -->
        <div style="padding: 10px; flex: 1; overflow-y: auto;">
          <div style="font-weight: bold; color: #000; font-size: 11px; margin-bottom: 5px;">Väntande förfrågningar</div>
          <div id="pendingRequestsList" style="font-size: 11px;">
            <p style="color: #666; margin: 0; font-size: 11px;">Inga väntande förfrågningar</p>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div style="flex: 1; display: flex; flex-direction: column; background: #ece9d8;">
        <div id="noChatSelected" style="flex: 1; display: flex; align-items: center; justify-content: center;">
          <p style="color: #999; font-size: 12px;">Välj en kontakt för att chatta</p>
        </div>

        <div id="chatArea" style="display: none; flex-direction: column; height: 100%;">
          <div id="activeChatHeader" style="background: #c0c0c0; padding: 4px 8px; border-bottom: 1px solid #7f7f7f; font-size: 11px; border-top: 1px solid #dfce56; border-left: 1px solid #dfce56; border-right: 2px solid #808080;"></div>

          <div id="chatMessagesContainer" style="flex: 1; padding: 10px; overflow-y: auto; background: #fff; border: 1px solid #7f9db9; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1); margin: 8px; font-size: 11px;"></div>

          <div id="typingIndicator" style="display: none; padding: 4px 8px; font-size: 11px; color: #666; font-style: italic;"></div>

          <form id="chatMessageForm" style="display: flex; gap: 4px; padding: 8px; background: #ece9d8; border-top: 1px solid #dfce56;">
            <input
              type="text"
              id="chatMessageInput"
              placeholder="Meddelande..."
              style="flex: 1; padding: 4px 6px; border: 1px solid #999; background: #fff; font-size: 11px; font-family: Tahoma, Arial;"
            >
            <button
              type="submit"
              style="padding: 4px 12px; font-size: 11px;"
            >Skicka</button>
            <button
              type="button"
              id="nudgeBtn"
              style="padding: 4px 12px; font-size: 11px;"
            >Titresha</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ===== SESSION MANAGEMENT =====
    function showAuthContainer() {
      document.getElementById('authContainer').style.display = 'block';
      document.getElementById('chatContainer').style.display = 'none';
    }

    // Check if user is already logged in on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/api/auth/me', {
          credentials: 'include'
        });

        if (response.ok) {
          const data = await response.json();
          if (data.success && data.user) {
            currentUserId = data.user.id;
            socket.emit('user_connected', data.user.id);
            showChatContainer(data.user.username);
          } else {
            showAuthContainer();
          }
        } else {
          showAuthContainer();
        }
      } catch (error) {
        console.error('Kunde inte kontrollera session:', error);
        showAuthContainer();
      }
    });

    // Logout function
    async function performLogout() {
      try {
        const response = await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });

        if (response.ok) {
          if (socket && socket.connected) {
            socket.disconnect();
            socket.connect();
          }
          showAuthContainer();
          document.getElementById('loginForm').reset();
        }
      } catch (error) {
        console.error('Logout error:', error);
      }
    }

    // ===== CONTACTS MANAGEMENT =====

    // Socket.io-anslutning för realtidsmeddelanden
    const socket = io();

    // Aktiv chatt just nu (null = ingen vald)
    let activeChatUser = null;
    let currentUsername = null;
    let currentUserId = null;
    let onlineUserIds = [];

    socket.on('new_message', (message) => {
      if (activeChatUser && parseInt(activeChatUser.conversationId) === parseInt(message.conversation_id)) {
        appendMessageBubble(message, true);
        const container = document.getElementById('chatMessagesContainer');
        container.scrollTop = container.scrollHeight;
      }
    });

    socket.on('user_status_change', ({ userId, status }) => {
      if (status === 'online') {
        if (!onlineUserIds.includes(userId)) {
          onlineUserIds.push(userId);
        }
      } else {
        onlineUserIds = onlineUserIds.filter(id => id !== userId);
      }
      updateContactStatusUI(userId, status);
    });

    socket.on('user_typing', ({ username }) => {
      const indicator = document.getElementById('typingIndicator');
      indicator.textContent = `${username} skriver ett meddelande...`;
      indicator.style.display = 'block';
    });

    socket.on('user_stop_typing', () => {
      const indicator = document.getElementById('typingIndicator');
      indicator.style.display = 'none';
      indicator.textContent = '';
    });

    socket.on('friend_request_received', ({ from }) => {
      loadContacts();
    });

    socket.on('friend_request_accepted', ({ from }) => {
      loadContacts();
    });

    socket.on('contact_removed', ({ contactRecordId }) => {
      if (activeChatUser && parseInt(activeChatUser.contactRecordId) === parseInt(contactRecordId)) {
        resetChatArea();
      }
      loadContacts();
    });

    // Skrivindikator - debounce timer för typing_stop
    let typingTimeout = null;

    function resetTypingTimeout() {
      if (typingTimeout) clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        if (activeChatUser && activeChatUser.conversationId) {
          socket.emit('typing_stop', { conversationId: activeChatUser.conversationId });
        }
      }, 2500);
    }

    // Search users
    async function performSearch() {
      const query = document.getElementById('userSearchInput').value.trim();

      if (!query) {
        document.getElementById('searchResults').style.display = 'none';
        return;
      }

      try {
        const response = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`, {
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success && data.users.length > 0) {
          displaySearchResults(data.users);
          document.getElementById('searchResults').style.display = 'block';
        } else {
          document.getElementById('searchResultsList').innerHTML = '<p style="color: #666;">Ingen användare hittad</p>';
          document.getElementById('searchResults').style.display = 'block';
        }
      } catch (error) {
        console.error('Search error:', error);
        document.getElementById('searchResultsList').innerHTML = '<p style="color: red;">Sökfel</p>';
      }
    }

    function handleSearchKeypress(event) {
      if (event.key === 'Enter') {
        performSearch();
      }
    }

    function displaySearchResults(users) {
      const resultsList = document.getElementById('searchResultsList');
      resultsList.innerHTML = '';

      users.forEach(user => {
        const resultItem = document.createElement('div');
        resultItem.style.cssText = 'padding: 8px; background: white; margin-bottom: 5px; border-radius: 3px; border: 1px solid #ddd;';
        resultItem.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${user.username}</strong><br>
              <small style="color: #666;">${user.email}</small>
            </div>
            <button onclick="sendFriendRequest(${user.id})" style="padding: 5px 10px; background: #667eea; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;">
              Lägg till
            </button>
          </div>
        `;
        resultsList.appendChild(resultItem);
      });
    }

    async function sendFriendRequest(contactId) {
      try {
        const response = await fetch('/api/contacts/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ contactId })
        });

        const data = await response.json();

        if (data.success) {
          alert('Förfrågan skickad!');
          document.getElementById('userSearchInput').value = '';
          document.getElementById('searchResultsList').innerHTML = '';
          document.getElementById('searchResults').style.display = 'none';
        } else {
          alert('Fel: ' + data.message);
        }
      } catch (error) {
        console.error('Send request error:', error);
        alert('Kunde inte skicka förfrågan');
      }
    }

    // Hämtar både kontakter och väntande förfrågningar
    async function loadContacts() {
      try {
        const response = await fetch('/api/contacts', {
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          const onlineResponse = await fetch('/api/users/online', {
            credentials: 'include'
          });

          const onlineData = await onlineResponse.json();
          if (onlineData.success) {
            onlineUserIds = onlineData.onlineUserIds;
          }

          displayFriends(data.friends || []);

          if (data.pendingRequests && data.pendingRequests.length > 0) {
            displayPendingRequests(data.pendingRequests);
          } else {
            document.getElementById('pendingRequestsList').innerHTML = '<p style="color: #666;">Inga väntande förfrågningar</p>';
          }
        }
      } catch (error) {
        console.error('Load contacts error:', error);
      }
    }

    function displayFriends(friends) {
      const list = document.getElementById('friendsList');

      if (!friends.length) {
        list.innerHTML = '<p style="color: #666; margin: 0; font-size: 11px;">Inga kontakter än</p>';
        return;
      }

      list.innerHTML = '';

      friends.forEach(friend => {
        const isOnline = onlineUserIds.includes(friend.user_id);
        const statusClass = isOnline ? 'status-online' : 'status-offline';

        const item = document.createElement('div');
        item.setAttribute('data-user-id', friend.user_id);
        item.className = 'friend-item';
        item.style.cssText = 'padding: 6px 4px; background: #e8e8e8; margin-bottom: 2px; cursor: pointer; border-left: 3px solid transparent; font-size: 11px;';
        
        item.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="flex: 1;">
              <span class="status-indicator ${statusClass}" style="margin-right: 4px;"></span><strong>${friend.username}</strong><br>
              <small style="color: #666; font-size: 10px; margin-left: 14px;">${friend.email}</small>
            </div>
            <button style="padding: 2px 6px; background: #c0c0c0; border: 1px solid #dfce56; border-right: 2px solid #808080; border-bottom: 2px solid #808080; cursor: pointer; font-size: 10px; font-family: Tahoma, Arial; margin-left: 4px;">
              Ta bort
            </button>
          </div>
        `;

        item.addEventListener('click', () => openChatWith(friend));
        item.addEventListener('mouseenter', () => item.style.background = '#d0d0d0');
        item.addEventListener('mouseleave', () => item.style.background = '#e8e8e8');
        
        item.querySelector('button').addEventListener('click', (event) => {
          event.stopPropagation();
          removeContact(friend);
        });

        list.appendChild(item);
      });
    }

    function updateContactStatusUI(userId, status) {
      const element = document.querySelector(`[data-user-id="${userId}"]`);
      if (!element) return;

      const indicator = element.querySelector('.status-indicator');
      if (!indicator) return;

      if (status === 'online') {
        indicator.classList.remove('status-offline');
        indicator.classList.add('status-online');
        indicator.setAttribute('title', 'Online');
      } else {
        indicator.classList.remove('status-online');
        indicator.classList.add('status-offline');
        indicator.setAttribute('title', 'Offline');
      }
    }

    async function removeContact(friend) {
      const confirmed = confirm('Är du säker på att du vill ta bort kontakten?');
      if (!confirmed) return;

      try {
        const response = await fetch(`/api/contacts/${friend.id}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          if (activeChatUser && activeChatUser.contactRecordId === friend.id) {
            resetChatArea();
          }
          loadContacts();
        } else {
          alert('Fel: ' + data.message);
        }
      } catch (error) {
        console.error('Remove contact error:', error);
        alert('Kunde inte ta bort kontakten');
      }
    }

    // Öppnar chattfönstret mot en vald kontakt och hämtar konversationen
    async function openChatWith(friend) {
      if (typingTimeout) {
        clearTimeout(typingTimeout);
        typingTimeout = null;
      }
      document.getElementById('typingIndicator').style.display = 'none';
      document.getElementById('typingIndicator').textContent = '';

      activeChatUser = {
        id: friend.user_id,
        username: friend.username,
        contactRecordId: friend.id
      };

      document.getElementById('noChatSelected').style.display = 'none';
      document.getElementById('chatArea').style.display = 'flex';
      document.getElementById('activeChatHeader').innerHTML = `Chattar med: <strong>${activeChatUser.username}</strong>`;
      document.getElementById('chatMessagesContainer').innerHTML = '<p style="color: #666;">Laddar meddelanden...</p>';

      try {
        const response = await fetch('/api/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ recipientId: friend.user_id })
        });

        const data = await response.json();

        if (data.success) {
          activeChatUser.conversationId = data.conversationId;
          socket.emit('join_conversation', data.conversationId);
          loadConversationMessages(data.conversationId);
        } else {
          document.getElementById('chatMessagesContainer').innerHTML = '<p style="color: red;">Kunde inte öppna konversationen</p>';
        }
      } catch (error) {
        console.error('Open conversation error:', error);
        document.getElementById('chatMessagesContainer').innerHTML = '<p style="color: red;">Kunde inte öppna konversationen</p>';
      }
    }

    // Hämtar och visar meddelandehistorik för en konversation
    async function loadConversationMessages(conversationId) {
      try {
        const response = await fetch(`/api/conversations/${conversationId}/messages`, {
          credentials: 'include'
        });

        const data = await response.json();
        const container = document.getElementById('chatMessagesContainer');
        container.innerHTML = '';

        if (!data.success || !data.messages.length) {
          container.innerHTML = '<p style="color: #999; text-align: center;">Inga meddelanden än. Skriv något!</p>';
          return;
        }

        data.messages.forEach(message => appendMessageBubble(message, false));

        container.scrollTop = container.scrollHeight;
      } catch (error) {
        console.error('Load messages error:', error);
        document.getElementById('chatMessagesContainer').innerHTML = '<p style="color: red;">Kunde inte ladda meddelanden</p>';
      }
    }

    // Lägger till en enskild meddelandebubbla i chattfönstret
    function appendMessageBubble(message, isLive = false) {
      const container = document.getElementById('chatMessagesContainer');

      if (message.message_type === 'nudge') {
        if (isLive) {
          const chatArea = document.getElementById('chatArea');
          chatArea.classList.remove('nudge-shake');
          void chatArea.offsetWidth;
          chatArea.classList.add('nudge-shake');
          setTimeout(() => chatArea.classList.remove('nudge-shake'), 500);
        }

        const timestamp = new Date(message.created_at).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
        const nudgeWrapper = document.createElement('div');
        nudgeWrapper.className = 'msn-nudge';
        nudgeWrapper.textContent = `* ${message.sender_username} skickade en nudge (${timestamp}) *`;
        container.appendChild(nudgeWrapper);
        return;
      }

      const isOwnMessage = parseInt(message.sender_id) === parseInt(currentUserId);

      const timestamp = new Date(message.created_at).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      const messageWrapper = document.createElement('div');
      messageWrapper.className = 'msn-message-wrapper';

      const senderLine = document.createElement('div');
      senderLine.className = 'msn-sender-line';
      senderLine.style.color = isOwnMessage ? '#1976d2' : '#d32f2f';
      senderLine.textContent = `${message.sender_username} säger (${timestamp}):`;

      const messageText = document.createElement('div');
      messageText.className = 'msn-message-text';
      messageText.textContent = message.content;

      messageWrapper.appendChild(senderLine);
      messageWrapper.appendChild(messageText);
      container.appendChild(messageWrapper);
    }

    // Nollställer chattvyn, t.ex. efter borttagen kontakt
    function resetChatArea() {
      if (typingTimeout) {
        clearTimeout(typingTimeout);
        typingTimeout = null;
      }
      document.getElementById('typingIndicator').style.display = 'none';
      document.getElementById('typingIndicator').textContent = '';

      activeChatUser = null;
      document.getElementById('chatArea').style.display = 'none';
      document.getElementById('noChatSelected').style.display = 'flex';
      document.getElementById('chatMessagesContainer').innerHTML = '';
    }

    // Skickar meddelandet till backend, mottas via socket för visning
    document.getElementById('chatMessageForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const input = document.getElementById('chatMessageInput');
      const text = input.value.trim();
      if (!text || !activeChatUser || !activeChatUser.conversationId) return;

      if (typingTimeout) {
        clearTimeout(typingTimeout);
        typingTimeout = null;
        socket.emit('typing_stop', { conversationId: activeChatUser.conversationId });
      }

      try {
        const response = await fetch(`/api/conversations/${activeChatUser.conversationId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ content: text, messageType: 'text' })
        });

        const data = await response.json();

        if (data.success) {
          input.value = '';
        } else {
          alert('Fel: ' + data.message);
        }
      } catch (error) {
        console.error('Send message error:', error);
        alert('Kunde inte skicka meddelandet');
      }
    });

    // Lyssnar på tangenttryckningar för skrivindikator
    document.getElementById('chatMessageInput').addEventListener('input', () => {
      if (!activeChatUser || !activeChatUser.conversationId) return;

      const input = document.getElementById('chatMessageInput');
      if (input.value.trim().length > 0) {
        socket.emit('typing_start', { 
          conversationId: activeChatUser.conversationId, 
          username: currentUsername 
        });
        resetTypingTimeout();
      } else {
        if (typingTimeout) {
          clearTimeout(typingTimeout);
          typingTimeout = null;
        }
        socket.emit('typing_stop', { conversationId: activeChatUser.conversationId });
      }
    });

    // Skickar en retro-nudge till motparten
    document.getElementById('nudgeBtn').addEventListener('click', async () => {
      if (!activeChatUser || !activeChatUser.conversationId) return;

      try {
        const response = await fetch(`/api/conversations/${activeChatUser.conversationId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ content: '* Skickade en nudge *', messageType: 'nudge' })
        });

        const data = await response.json();

        if (!data.success) {
          alert('Fel: ' + data.message);
        }
      } catch (error) {
        console.error('Send nudge error:', error);
        alert('Kunde inte skicka nudge');
      }
    });

    function displayPendingRequests(requests) {
      const list = document.getElementById('pendingRequestsList');
      list.innerHTML = '';

      requests.forEach(request => {
        const requestItem = document.createElement('div');
        requestItem.style.cssText = 'padding: 10px; background: white; margin-bottom: 8px; border-radius: 3px; border: 1px solid #ddd;';
        requestItem.innerHTML = `
          <div>
            <strong style="font-size: 12px;">${request.username}</strong>
            <div style="font-size: 11px; color: #666; margin: 5px 0;">${request.email}</div>
            <div style="display: flex; gap: 5px; margin-top: 8px;">
              <button onclick="acceptRequest(${request.id})" style="flex: 1; padding: 5px; background: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;">
                Acceptera
              </button>
              <button onclick="rejectRequest(${request.id})" style="flex: 1; padding: 5px; background: #f44336; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;">
                Avvisa
              </button>
            </div>
          </div>
        `;
        list.appendChild(requestItem);
      });
    }

    async function acceptRequest(contactId) {
      try {
        const response = await fetch(`/api/contacts/${contactId}/accept`, {
          method: 'PUT',
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          loadContacts();
        } else {
          alert('Fel: ' + data.message);
        }
      } catch (error) {
        console.error('Accept error:', error);
      }
    }

    async function rejectRequest(contactId) {
      try {
        const response = await fetch(`/api/contacts/${contactId}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
          loadContacts();
        } else {
          alert('Fel: ' + data.message);
        }
      } catch (error) {
        console.error('Reject error:', error);
      }
    }

    // Visar chattvyn och laddar kontaktlistan
    function showChatContainer(username) {
      currentUsername = username;
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('chatContainer').style.display = 'flex';
      document.getElementById('usernameDisplay').textContent = username;
      loadContacts();
    }

    // ===== TAB SWITCHING =====
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
    }

    // ===== LOGIN FORM =====
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;

      loginMessage.textContent = 'Loggar in...';
      loginMessage.className = 'message loading';
      loginMessage.style.display = 'block';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (data.success) {
          loginMessage.textContent = '✅ ' + data.message;
          loginMessage.className = 'message success';
          setTimeout(() => {
            currentUserId = data.user?.id || null;
            socket.emit('user_connected', currentUserId);
            showChatContainer(data.user?.username || identifier);
            loginForm.reset();
          }, 1500);
        } else {
          loginMessage.textContent = '❌ ' + data.message;
          loginMessage.className = 'message error';
        }
      } catch (error) {
        loginMessage.textContent = '❌ Ett fel uppstod';
        loginMessage.className = 'message error';
      }
    });

    // ===== SIGNUP FORM =====
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');
    const usernameInput = document.getElementById('regUsername');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('regPassword');
    const passwordConfirmInput = document.getElementById('passwordConfirm');

    usernameInput.addEventListener('input', checkUsernameRealtime);
    emailInput.addEventListener('input', validateEmailRealtime);
    passwordConfirmInput.addEventListener('input', validatePasswordsRealtime);

    async function checkUsernameRealtime() {
      const username = usernameInput.value.trim();
      const msg = document.getElementById('usernameMsg');
      if (!username) { msg.style.display = 'none'; return; }

      try {
        const response = await fetch(`/api/check-username/${username}`);
        const data = await response.json();
        if (data.exists) {
          msg.textContent = '❌ Användarnamnet är redan taget';
          msg.className = 'validation-msg error';
        } else {
          msg.textContent = '✅ Användarnamnet är tillgängligt';
          msg.className = 'validation-msg success';
        }
      } catch (error) {
        msg.textContent = '❌ Kunde inte verifiera användarnamn';
        msg.className = 'validation-msg error';
      }
    }

    async function validateEmailRealtime() {
      const email = emailInput.value.trim();
      const msg = document.getElementById('emailMsg');
      if (!email) { msg.style.display = 'none'; return; }

      if (!isValidEmail(email)) {
        msg.textContent = '❌ Ogiltig e-postformat';
        msg.className = 'validation-msg error';
        return;
      }

      try {
        const response = await fetch(`/api/check-email/${encodeURIComponent(email)}`);
        const data = await response.json();
        if (data.exists) {
          msg.innerHTML = '❌ E-postadressen är redan registrerad<br><small>Försök <a href="#" onclick="switchTab(\'login\'); return false;">logga in</a> istället</small>';
          msg.className = 'validation-msg error';
        } else {
          msg.textContent = '✅ E-postadressen är tillgänglig';
          msg.className = 'validation-msg success';
        }
      } catch (error) {
        msg.textContent = '❌ Kunde inte verifiera e-post';
        msg.className = 'validation-msg error';
      }
    }

    function validatePasswordsRealtime() {
      const password = passwordInput.value;
      const confirm = passwordConfirmInput.value;
      const msg = document.getElementById('passwordMsg');

      if (!confirm) { msg.style.display = 'none'; return; }

      if (password === confirm && password.length > 0) {
        msg.textContent = '✅ Lösenorden matchar';
        msg.className = 'validation-msg success';
      } else if (password.length > 0) {
        msg.textContent = '❌ Lösenorden matchar inte';
        msg.className = 'validation-msg error';
      } else {
        msg.style.display = 'none';
      }
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const username = usernameInput.value;
      const email = emailInput.value;
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;
      const gender = document.getElementById('gender').value;
      const birthDate = document.getElementById('birthDate').value;

      if (password !== passwordConfirm) {
        signupMessage.textContent = '❌ Lösenorden matchar inte';
        signupMessage.className = 'message error';
        signupMessage.style.display = 'block';
        return;
      }

      if (!isValidEmail(email)) {
        signupMessage.textContent = '❌ Ogiltig e-postformat';
        signupMessage.className = 'message error';
        signupMessage.style.display = 'block';
        return;
      }

      signupMessage.textContent = 'Registrerar...';
      signupMessage.className = 'message loading';
      signupMessage.style.display = 'block';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName, lastName, username, email, password,
            gender: parseInt(gender), birthDate
          })
        });

        const data = await response.json();

        if (data.success) {
          signupMessage.textContent = '✅ ' + data.message;
          signupMessage.className = 'message success';
          setTimeout(() => {
            signupForm.reset();
            switchTab('login');
          }, 2000);
        } else {
          signupMessage.textContent = '❌ ' + data.message;
          signupMessage.className = 'message error';
        }
      } catch (error) {
        signupMessage.textContent = '❌ Ett fel uppstod';
        signupMessage.className = 'message error';
      }
    });
  </script>
</body>
</html>
